<h1>Activity Collector</h1>
<p>Activity Collector is a personal tool run by one person on their own computer. It copies that person's own Swarm check-ins into a Google Calendar in their own account.</p>
<p>It is not offered to anyone else, and no one else can sign in to it.</p>
